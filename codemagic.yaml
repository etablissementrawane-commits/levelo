workflows:
  ios-testflight:
    name: "Levelo: Gamify Habits"
    max_build_duration: 60
    instance_type: mac_mini_m2

    # This must match the App Store Connect integration name in Codemagic.
    integrations:
      app_store_connect: "Yamna Mojahid"

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.levelo.habitsgame
      ios_signing:
        # These are the reference names of the profile and certificate uploaded
        # under Codemagic Team settings > codemagic.yaml settings > Code signing identities.
        provisioning_profiles:
          - LeveloProf
        certificates:
          - DogCer

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build signed Flutter IPA
        script: |
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - yamna.light@icloud.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Add submit_to_app_store: true when the app record and store listing are ready.
